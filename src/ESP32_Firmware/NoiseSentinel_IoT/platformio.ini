; PlatformIO Project Configuration File
;
; NoiseSentinel IoT Firmware
; Optimized build settings for ESP32
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Use partition scheme with more app space (3MB app, 1MB SPIFFS)
board_build.partitions = huge_app.csv

; Compiler optimization flags
build_flags = 
    -Os                          ; Optimize for size
    -DCORE_DEBUG_LEVEL=0         ; Disable debug messages
    -DBOARD_HAS_PSRAM            ; Enable PSRAM if available
    -ffunction-sections          ; Each function in its own section
    -fdata-sections              ; Each data in its own section
    -Wl,--gc-sections            ; Remove unused sections

; Upload settings
upload_speed = 115200
monitor_speed = 115200

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    h2zero/NimBLE-Arduino@^1.4.0
